name: 🛡️ Gatekeeper (CI)

on:
  pull_request:
    branches: [main, develop]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-json # Checks this for changes
      
      - name: Install & Test Frontend
        run: |
          cd frontend
          npm install
          npm run test:unit # Runs Vitest

  test-microservices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install & Test CV Generator
        run: |
          cd microservices/cv-generator
          npm install
          npm test