name: 🛡️ Gatekeeper (CI)

on:
  pull_request:
    branches: [main, develop]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install & Test Frontend
        run: |
          cd frontend
          npm install
          npm run test:unit # Runs Vitest

  test-microservices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the CV generator exists yet
        id: cv
        run: |
          if [ -f microservices/cv-generator/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "microservices/cv-generator not created yet, skipping"; fi
      - name: Setup Node.js
        if: steps.cv.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      
      - name: Install & Test CV Generator
        if: steps.cv.outputs.exists == 'true'
        run: |
          cd microservices/cv-generator
          npm install
          npm test