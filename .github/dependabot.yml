version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: feat/auth-and-BrandBookEditor
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 0.5 needs eslint 9 (we are on 8). Remove this when eslint is upgraded.
      - dependency-name: eslint-plugin-react-refresh
        versions: [">=0.5.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: feat/auth-and-BrandBookEditor
