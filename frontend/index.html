<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>%BRAND_NAME%</title>
  <meta name="description" content="%BRAND_NAME% - portfolio and small tools by Ekin Efe Gungor." />
  <meta name="theme-color" content="#050505" />
  <meta name="color-scheme" content="dark" />

  <!-- Open Graph / Twitter. Per-page title, description and URL are set at runtime (useDocumentMeta).
       og:image is left out until the site has a real domain and a 1200x630 PNG. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="%BRAND_NAME%" />
  <meta property="og:title" content="%BRAND_NAME%" />
  <meta property="og:description" content="%BRAND_NAME% - portfolio and small tools by Ekin Efe Gungor." />
  <meta name="twitter:card" content="summary" />

  <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> -->
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&family=Space+Grotesk:wght@300..700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
